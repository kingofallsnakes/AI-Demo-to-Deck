[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-to-deck"
version = "1.0.0"
description = "Turn code repositories into structured pitch decks, timed walkthrough scripts, and presentation materials."
readme = "README.md"
authors = [{ name = "AI Demo-to-Deck Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["presentation", "pitch-deck", "pptx", "ai-agent", "streamlit", "code-analysis"]
dependencies = [
    "streamlit>=1.28.0,<2",
    "python-pptx>=0.6.21",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
browser = [
    "playwright>=1.40.0",
]

[project.scripts]
demo-to-deck = "demo_to_deck.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
